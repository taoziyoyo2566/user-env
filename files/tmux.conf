# ~/.tmux.conf — 由 user-env/setup-terminal-env.sh 生成，重复运行会覆盖（旧文件备份为 .bak.<时间>）
# 要改配置请改 user-env/files/tmux.conf，再运行 setup-terminal-env.sh；重载配置：prefix + R（tmux-sensible 提供）

# ── 终端与颜色 ──────────────────────────────────────────
set -g default-terminal "screen-256color"
# terminal-features 取代已弃用的 terminal-overrides；先复位再追加，重载时条目不会重复累积
set -su terminal-features
set -as terminal-features 'xterm*:RGB'

# Claude Code 官方要求：tmux 内 Shift+Enter 才能换行，通知/进度条才能穿透到外层终端
# allow-passthrough 需要 tmux 3.3+，-q 让 3.2 上忽略而不报错
set -gq allow-passthrough on
set -sq extended-keys on
set -as terminal-features 'xterm*:extkeys'

# ── 基础设置 ────────────────────────────────────────────
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# 鼠标选中 / 复制模式复制直接进系统剪贴板，不依赖终端支持 OSC 52；后面的覆盖前面的
if-shell 'command -v xclip' "set -sq copy-command 'xclip -selection clipboard -in'"
if-shell 'command -v wl-copy' "set -sq copy-command 'wl-copy'"
if-shell 'command -v pbcopy' "set -sq copy-command 'pbcopy'"

# ── 状态栏 ──────────────────────────────────────────────
# 状态栏保持显示
set -g status on

# 状态栏左侧：绿底「tmux: 会话名」，一眼看出当前在 tmux 里；Team 会话（claude-team）前面再加紫底 TEAM
set -g status-left '#{?#{==:#{@claude_profile},team},#[fg=white#,bg=magenta#,bold] TEAM #[default] ,}#[fg=#11111b,bg=#a6e3a1,bold] tmux: #S #[default] '

# 状态栏左侧宽度
set -g status-left-length 40

# status-right 必须在 run tpm 之前设置：continuum 加载时把自动保存钩子插到 status-right 开头，
# 之后再整体 set status-right 会把它覆盖掉，自动保存静默失效
set -g status-right-length 100
set -g status-right '#{E:@catppuccin_status_application}#{E:@catppuccin_status_date_time}'

# ── 按键 ────────────────────────────────────────────────
# 前缀键改为 Ctrl+a（更顺手）
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 分屏、新窗口都沿用当前目录
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── 插件（TPM）──────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.2'        # 好看的主题；固定 tag，换版本改这里再运行 setup-terminal-env.sh（prefix+U 换不了版本）
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ── 会话持久化 ──────────────────────────────────────────
# 每 15 分钟自动保存；tmux 服务器启动时自动恢复（至少保存过一次才有内容可恢复）
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
# 同时保存 pane 当前可见的屏幕内容；只存可见区域而不是全部滚动历史，减少明文落盘量
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-pane-contents-area 'visible'

# ── 主题图标 ────────────────────────────────────────────
# @@USER_ENV_ICONS@@

run '~/.tmux/plugins/tpm/tpm'
